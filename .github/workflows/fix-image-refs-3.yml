name: Use repository image assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-image-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Point site at repository image files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('client/src/pages/SitePages.tsx')
          text = path.read_text()
          replacements = {
              '/manus-storage/erlc-hero_41f8c6c0.png': '/erlc-hero.png',
              '/manus-storage/bridge_4b250610.png': '/bridge.png',
              '/manus-storage/high-rock-park_957d9291.png': '/high-rock-park.png',
              '/manus-storage/park-ranger-vehicles_3bab4b17.png': '/park-ranger-vehicles.png',
              '/manus-storage/night-police_c237eb32.png': '/night-police.png',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Commit source repair and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-image-refs-3.yml
          git add client/src/pages/SitePages.tsx .github/workflows/fix-image-refs-3.yml
          if git diff --cached --quiet; then
            echo 'No image changes required.'
            exit 0
          fi
          git commit -m 'Serve supplied images from Pages assets'
          git push
